    <!-- 修正 Tailwind @apply 編譯環境 -->
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            transition: font-size 0.2s ease;
            @apply bg-slate-100 text-slate-900;
        }
        .tab-active { @apply bg-emerald-600 text-white shadow-lg scale-105; }
        .table-container { 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; 
            @apply rounded-xl shadow-inner bg-white border border-slate-200;
        }
        table { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: auto; }
        th { 
            @apply bg-slate-50 text-slate-600 font-bold p-3 text-left text-xs uppercase tracking-wider sticky top-0 z-10 border-b border-slate-200 whitespace-nowrap select-none transition-colors;

        th.sortable { @apply cursor-pointer hover:bg-slate-200 hover:text-emerald-700; }

        /* 藥品名稱欄位：自適應寬度，不擠壓 */
        .medicine-name-cell { 
            white-space: normal; 
            word-break: break-all; 
            min-width: 130px; 
            max-width: 300px;
            @apply font-bold text-slate-800;
        }
        .storage-cell { @apply font-black text-emerald-600 whitespace-nowrap text-lg; }
        .mono-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        .table-container::-webkit-scrollbar { height: 6px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

</head>
<body>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBFYVcsjvev6QDyPYybVLudf-lkEHzf-Xc",
            authDomain: "fyh-tcm.firebaseapp.com",
            projectId: "fyh-tcm",
            storageBucket: "fyh-tcm.firebasestorage.app",
            messagingSenderId: "710368833882",

    <!-- 預設載入與自動診斷畫面 -->
    <div id="root">
        <div id="diagnostic-loader" class="flex flex-col items-center justify-center min-h-screen bg-slate-100 text-slate-800 p-6">
            <div id="loader-spinner" class="w-12 h-12 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin mb-4"></div>
            <div id="loader-status" class="text-emerald-700 font-black text-lg mb-2">系統載入中，請稍候...</div>
            <div id="loader-substatus" class="text-slate-400 text-sm max-w-md text-center">正在讀取雲端資料庫與介面元件，若長時間無反應請參考下方診斷：</div>
            
            <!-- 診斷報告區塊（預設隱藏，3秒後未載入成功則顯示） -->
            <div id="loader-diagnostics" class="mt-6 p-5 bg-white rounded-2xl border border-slate-200 text-left w-full max-w-md text-xs font-mono space-y-2 hidden shadow-lg">
                <div class="font-bold text-rose-600 border-b pb-2 text-sm flex items-center gap-1">
                    ⚠️ 豐醫系統連線診斷報告：
                </div>
                <div id="diag-react">● React 網頁引擎: <span class="text-slate-400">檢測中...</span></div>
                <div id="diag-firebase">● Firebase 模組載入: <span class="text-slate-400">檢測中...</span></div>
                <div id="diag-firebase-connection">● Firebase 雲端連線: <span class="text-slate-400">檢測中...</span></div>
                <div id="diag-firebase-rules">● Firebase 讀寫權限: <span class="text-slate-400">檢測中...</span></div>
                <div id="diag-excel">● Excel 匯入模組: <span class="text-slate-400">檢測中...</span></div>
                <div id="diag-qrcode">● 相機條碼掃描模組: <span class="text-slate-400">檢測中...</span></div>
                <div id="diag-network" class="pt-3 text-rose-600 font-bold border-t mt-2"></div>
            </div>
        </div>
    </div>

    <!-- 網頁診斷專用原生腳本 -->
    <script>
        setTimeout(function() {
            var diagBox = document.getElementById('loader-diagnostics');
            var loaderStatus = document.getElementById('loader-status');
            var loaderSpinner = document.getElementById('loader-spinner');
            if (!diagBox) return; // 如果 React 成功掛載，#root 內容會被覆蓋，此處將找不到元素，直接結束

            diagBox.classList.remove('hidden');
            loaderStatus.innerText = "連線延遲，進行環境診斷中...";
            loaderStatus.className = "text-amber-600 font-black text-lg mb-2";

            var hasError = false;

            // 1. 檢測 React
            var diagReact = document.getElementById('diag-react');
            if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') {
                diagReact.innerHTML = "● React 網頁引擎: <span class='text-emerald-600 font-bold'>✓ 載入成功</span>";
            } else {
                diagReact.innerHTML = "● React 網頁引擎: <span class='text-rose-600 font-bold'>✗ 載入失敗 (被院內防火牆封鎖)</span>";
                hasError = true;
            }

            // 2. 檢測 Firebase 庫
            var diagFirebase = document.getElementById('diag-firebase');
            if (typeof firebase !== 'undefined') {
                diagFirebase.innerHTML = "● Firebase 模組載入: <span class='text-emerald-600 font-bold'>✓ 載入成功</span>";
            } else {
                diagFirebase.innerHTML = "● Firebase 模組載入: <span class='text-rose-600 font-bold'>✗ 載入失敗 (被院內防火牆封鎖)</span>";
                hasError = true;
            }

            // 3. 實時嘗試連線與權限測試
            var diagConnect = document.getElementById('diag-firebase-connection');
            var diagRules = document.getElementById('diag-firebase-rules');
            var isDiagnosticDone = false;

            // 設置 5 秒超時，防止連線無回應（防火牆丟包）
            var firebaseTimeout = setTimeout(function() {
                if (!isDiagnosticDone) {
                    isDiagnosticDone = true;
                    diagConnect.innerHTML = "● Firebase 雲端連線: <span class='text-rose-600 font-bold'>✗ 連線超時 (5秒內無回應，可能被院內防火牆攔截)</span>";
                    diagRules.innerHTML = "● Firebase 讀寫權限: <span class='text-rose-600 font-bold'>✗ 無法測試 (因連線超時)</span>";
                    loaderSpinner.className = "w-12 h-12 border-4 border-rose-200 border-t-rose-600 rounded-full animate-pulse mb-4";
                    loaderStatus.innerText = "連線失敗 (Connection Timeout)";
                    loaderStatus.className = "text-rose-600 font-black text-lg mb-2";
                    
                    var diagNetwork = document.getElementById('diag-network');
                    diagNetwork.innerHTML = "<b>排解建議：</b><br/>" +
                        "1. 偵測到 Firebase 通訊無回應。這 100% 是因為<b>醫院防火牆封鎖了 Google Firebase 的 API 連線</b>。<br/>" +
                        "2. 請嘗試<b>用手機開啟行動網路熱點</b>，並將電腦/平板連上手機熱點，重整此網頁即可秒速載入。<br/>" +
                        "3. 若必須使用院內網，請聯繫醫院資訊室，將以下網域加入防火牆白名單：<br/>" +
                        "   - <span class='bg-slate-100 p-0.5 rounded'>*.firebaseio.com</span><br/>" +
                        "   - <span class='bg-slate-100 p-0.5 rounded'>*.googleapis.com</span><br/>" +
                        "   - <span class='bg-slate-100 p-0.5 rounded'>*.identitytoolkit.googleapis.com</span>";
                }
            }, 5000);

            if (typeof firebase !== 'undefined') {
                try {
                    if (!firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    firebase.auth().signInAnonymously()
                        .then(function() {
                            if (isDiagnosticDone) return; // 已超時則不重複處理
                            clearTimeout(firebaseTimeout);
                            isDiagnosticDone = true;
                            diagConnect.innerHTML = "● Firebase 雲端連線: <span class='text-emerald-600 font-bold'>✓ 連線成功 (匿名登入已啟用)</span>";
                            // 測試 Firestore 讀寫
                            return firebase.firestore().collection('artifacts').doc('fyh-tcm-manager-v1').collection('public').doc('data').collection('medicines').limit(1).get();
                        })
                        .then(function() {
                            diagRules.innerHTML = "● Firebase 讀寫權限: <span class='text-emerald-600 font-bold'>✓ 權限讀寫正常</span>";
                        })
                        .catch(function(err) {
                            if (isDiagnosticDone && err === undefined) return;
                            clearTimeout(firebaseTimeout);
                            isDiagnosticDone = true;
                            if (err && err.code === "permission-denied") {
                                diagRules.innerHTML = "● Firebase 讀寫權限: <span class='text-rose-600 font-bold'>✗ 權限拒絕 (請檢查 Firestore 規則)</span>";
                            } else {
                                diagConnect.innerHTML = "● Firebase 雲端連線: <span class='text-rose-600 font-bold'>✗ 連線失敗 (" + (err ? err.message : "未知錯誤") + ")</span>";
                            }
                            hasError = true;
                        });
                } catch (e) {
                    clearTimeout(firebaseTimeout);
                    isDiagnosticDone = true;
                    diagConnect.innerHTML = "● Firebase 雲端連線: <span class='text-rose-600 font-bold'>✗ 連線死當 (" + e.message + ")</span>";
                    hasError = true;
                }
            } else {
                clearTimeout(firebaseTimeout);
                isDiagnosticDone = true;
                diagConnect.innerHTML = "● Firebase 雲端連線: <span class='text-rose-600 font-bold'>✗ 無法測試 (模組未載入)</span>";
                diagRules.innerHTML = "● Firebase 讀寫權限: <span class='text-rose-600 font-bold'>✗ 無法測試 (模組未載入)</span>";
                hasError = true;
            }

            // 4. 檢測 XLSX
            var diagExcel = document.getElementById('diag-excel');
            if (typeof XLSX !== 'undefined') {
                diagExcel.innerHTML = "● Excel 匯入模組: <span class='text-emerald-600 font-bold'>✓ 載入成功</span>";
            } else {
                diagExcel.innerHTML = "● Excel 匯入模組: <span class='text-rose-600 font-bold'>✗ 載入失敗</span>";
                hasError = true;
            }

            // 5. 檢測 QRCode
            var diagQrcode = document.getElementById('diag-qrcode');
            if (typeof Html5Qrcode !== 'undefined') {
                diagQrcode.innerHTML = "● 相機條碼掃描模組: <span class='text-emerald-600 font-bold'>✓ 載入成功</span>";
            } else {
                diagQrcode.innerHTML = "● 相機條碼掃描模組: <span class='text-rose-600 font-bold'>✗ 載入失敗</span>";
                hasError = true;
            }
        }, 3000); // 3秒後若 React 未成功執行則啟動診斷
    </script>

    <!-- 主程式腳本 -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // 安全初始化：避免 firebase 載入失敗時整支 JavaScript 報錯崩潰
        let auth = null;
        let db = null;
        let isFirebaseActive = false;

        if (typeof firebase !== 'undefined') {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(window.firebaseConfig);
                }
                auth = firebase.auth();
                db = firebase.firestore();
                isFirebaseActive = true;
            } catch (e) {
                console.error("Firebase Initialize Failed", e);

        }
        
        const TCM_APP_ID = 'fyh-tcm-manager-v1';
        const getMedicineRef = () => {

        };

                ),

                        <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M8 7v10M12 7v10M16 7v10"></path>

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>

                ),
                'volume-2': (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>

                filter: (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>

                ),
                download: (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path>

                x: (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>

            };
            return icons[name] || null;
        };

        // --- 子組件：排序圖示 ---
        const SortIcon = ({ colKey, currentKey, direction }) => {
            const sortable = ['代碼', '品名', '儲位', '廠商', '狀態'];
            if (!sortable.includes(colKey)) return null;
            if (currentKey !== colKey) return <Icon name="chevrons-up-down" className="w-3 h-3 ml-1 inline opacity-30" />;
            return direction === 'asc' 
                ? <Icon name="chevron-up" className="w-3 h-3 ml-1 inline text-emerald-600 font-bold" />
                : <Icon name="chevron-down" className="w-3 h-3 ml-1 inline text-emerald-600 font-bold" />;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [medicines, setMedicines] = useState([]);
            const [activeTab, setActiveTab] = useState('search');
            const [searchTerm, setSearchTerm] = useState('');
            const [listSearchTerm, setListSearchTerm] = useState('');
            const [scanMatch, setScanMatch] = useState(null);
            const [bindingTarget, setBindingTarget] = useState(null);
            const [sortConfig, setSortConfig] = useState({ key: '儲位', direction: 'asc' });
            const [isScannerOpen, setIsScannerOpen] = useState(false);
            const [isEditing, setIsEditing] = useState(null);
            const [isAdding, setIsAdding] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [fontSize, setFontSize] = useState(16);

            const html5QrCode = useRef(null);
            const autoClearTimer = useRef(null);

            // 初始化與匿名登入
            useEffect(() => {
                if (!isFirebaseActive) return;
                const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                    if (u) setUser(u);
                    else auth.signInAnonymously().catch(err => console.error("Anonymous auth failed", err));
                });
                return () => unsubscribeAuth();
            }, []);

            // 實時監聽 (增加安全防護防 Crashing)
            useEffect(() => {
                if (!user || !isFirebaseActive) return;
                const ref = getMedicineRef();
                if (!ref) return;
                const unsubscribeData = ref.onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setMedicines(data);
                }, (err) => console.error("Database connection failed", err));
                return () => unsubscribeData();
            }, [user]);

            // --- 5 秒自動清空結果 ---
            useEffect(() => {
                if (searchTerm || scanMatch) {
                    if (autoClearTimer.current) clearTimeout(autoClearTimer.current);
                    autoClearTimer.current = setTimeout(() => {
                        setSearchTerm('');
                        setScanMatch(null);
                    }, 5000); // 精確 5 秒
                }
                return () => { if (autoClearTimer.current) clearTimeout(autoClearTimer.current); };
            }, [searchTerm, scanMatch]);

            const speak = useCallback((text) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 1.1;
                utterance.volume = 1.0; // 音量最大化
                window.speechSynthesis.speak(utterance);
            }, []);

            const handleSave = async (item) => {
                const ref = getMedicineRef();
                if (!ref) {
                    alert("目前未與雲端資料庫連線，無法儲存");
                    return;
                }
                try {
                    const id = item.id || (item.代碼 ? `med_${item.代碼}` : `med_${Date.now()}`);
                    await ref.doc(id).set({ ...item, id }, { merge: true });
                    setIsAdding(false);
                    setIsEditing(null);
                } catch (err) { alert("儲存資料失敗，請確認資料庫規則。"); }
            };

            const handleDelete = async (id) => {
                const ref = getMedicineRef();
                if (!ref) return;
                if (!confirm("確定要從雲端刪除此藥品嗎？")) return;
                await ref.doc(id).delete();
            };

            const handleSearchChange = (val) => {
                setSearchTerm(val);
                const cleanVal = val.replace(/\*/g, '').trim().toLowerCase();
                if (!cleanVal) { setScanMatch(null); return; }

                const match = medicines.find(m => 
                    String(m.條碼 || '').replace(/\*/g, '').toLowerCase() === cleanVal || 
                    String(m.代碼 || '').toLowerCase() === cleanVal
                );

                if (match) {
                    setScanMatch(match);
                    speak(match.儲位);
                } else {
                    setScanMatch(null);
                }
            };

            // --- 全量資料排序與過濾 (防止 Crash 安全保護) ---
            const processedInventory = useMemo(() => {
                try {
                    const term = listSearchTerm.toLowerCase().trim();
                    let filtered = medicines.filter(m => 
                        String(m.品名 || '').toLowerCase().includes(term) || 
                        String(m.代碼 || '').toLowerCase().includes(term) ||
                        String(m.儲位 || '').toLowerCase().includes(term) ||
                        String(m.廠商 || '').toLowerCase().includes(term) ||
                        String(m.狀態 || '').toLowerCase().includes(term)
                    );

                    if (!sortConfig.key) return filtered;

                    return [...filtered].sort((a, b) => {
                        const valA = String(a[sortConfig.key] || '').trim();
                        const valB = String(b[sortConfig.key] || '').trim();
                        if (sortConfig.direction === 'asc') {
                            return valA.localeCompare(valB, 'zh-TW', { numeric: true });
                        } else {
                            return valB.localeCompare(valA, 'zh-TW', { numeric: true });
                        }
                    });
                } catch (e) {
                    console.error("Sorting logic protection executed", e);
                    return medicines;
                }
            }, [medicines, listSearchTerm, sortConfig]);

            const toggleSort = (key) => {
                const sortableKeys = ['代碼', '品名', '儲位', '廠商', '狀態'];
                if (!sortableKeys.includes(key)) return;
                setSortConfig(prev => ({
                    key,
                    direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc'
                }));
            };

            const getFilteredResults = () => {
                const term = searchTerm.toLowerCase().replace(/\*/g, '').trim();
                if (!term) return [];
                return medicines.filter(m => 
                    String(m.品名 || '').toLowerCase().includes(term) ||
                    String(m.代碼 || '').toLowerCase().includes(term) ||
                    String(m.儲位 || '').toLowerCase().includes(term) ||
                    String(m.條碼 || '').toLowerCase().includes(term)
                ).slice(0, 15);
            };

            const handleExport = () => {
                const exportData = medicines.map(m => ({
                    '代碼': m.代碼 || '',
                    '品名': m.品名 || '',
                    '儲位': m.儲位 || '',
                    '廠商': m.廠商 || '',
                    '條碼': m.條碼 || '',
                    '狀態': m.狀態 || '正常'
                }));
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "中藥清單");
                XLSX.writeFile(wb, `豐醫中藥表_${new Date().toLocaleDateString()}.xlsx`);
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsLoading(true);
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const ref = getMedicineRef();
                    if (!ref) {
                        setIsLoading(false);
                        alert("目前未與雲端資料庫連線，無法匯入");
                        return;
                    }
                    try {
                        const wb = XLSX.read(evt.target.result, { type: 'binary' });
                        const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                        const batch = db.batch();
                        data.forEach((row, i) => {
                            if (row['品名']) {
                                const id = row['代碼'] ? `med_${row['代碼']}` : `med_${Date.now()}_${i}`;
                                batch.set(ref.doc(id), {
                                    id,
                                    代碼: String(row['代碼'] || ''),
                                    品名: String(row['品名'] || ''),
                                    儲位: String(row['儲位'] || ''),
                                    廠商: String(row['廠商'] || ''),
                                    條碼: String(row['條碼'] || '').replace(/\*/g, '').trim(),
                                    狀態: String(row['狀態'] || '正常')
                                }, { merge: true });
                            }
                        });
                        await batch.commit();
                        alert("資料同步雲端成功！");
                    } catch (err) { alert("匯入失敗"); }
                    finally { setIsLoading(false); }
                };
                reader.readAsBinaryString(file);
            };

            const startScanner = (callback) => {
                setIsScannerOpen(true);
                setTimeout(() => {
                    html5QrCode.current = new Html5Qrcode("reader");
                    html5QrCode.current.start(
                        { facingMode: "environment" }, 
                        { fps: 20, qrbox: { width: 260, height: 160 } }, 
                        (decodedText) => { stopScanner(); callback(decodedText); }
                    ).catch(() => { setIsScannerOpen(false); alert("無法啟動相機"); });
                }, 300);
            };

            const stopScanner = () => {
                if (html5QrCode.current?.isScanning) {
                    html5QrCode.current.stop().then(() => setIsScannerOpen(false)).catch(() => setIsScannerOpen(false));
                } else setIsScannerOpen(false);
            };

            const getStatusColor = (s) => {
                switch(s) {
                    case '正常': return 'text-emerald-700 bg-emerald-50 border-emerald-200';
                    case '缺貨中': return 'text-rose-700 bg-rose-50 border-rose-200';
                    case '暫代': return 'text-sky-700 bg-sky-50 border-sky-200';
                    case 'DC': return 'text-slate-500 bg-slate-100 border-slate-300';
                    default: return 'text-slate-600 bg-white border-slate-200';
                }
            };

            return (
                <div className="min-h-screen flex flex-col" style={{ fontSize: `${fontSize}px` }}>
                    {/* Header: 字體縮放控制 */}
                    <header className="bg-emerald-800 text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-[60]">
                        <div className="flex items-center gap-2">
                            <Icon name="database" className="w-5 h-5 text-emerald-400" />
                            <h1 className="text-lg font-black tracking-tight">豐醫中藥管理</h1>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="flex bg-white/20 rounded-lg p-1 gap-1 border border-white/20 shadow-inner">
                                <button onClick={() => setFontSize(f => Math.min(f + 2, 28))} className="px-3 py-1 text-sm font-black active:scale-90 transition">A+</button>
                                <button onClick={() => setFontSize(f => Math.max(f - 2, 12))} className="px-3 py-1 text-sm font-black active:scale-90 transition">A-</button>
                                <button onClick={() => setFontSize(16)} className="px-2 py-1 text-xs opacity-60 hover:opacity-100">重置</button>
                            </div>
                        </div>
                    </header>

                    {/* Navbar */}
                    <nav className="flex bg-white border-b sticky top-[62px] z-40 p-1 gap-1 shadow-sm">
                        {[
                            { id: 'search', label: '查詢 / 掃描', icon: 'zap' },
                            { id: 'inventory', label: '品項總表', icon: 'table' }
                        ].map(t => (
                            <button key={t.id} onClick={() => { setActiveTab(t.id); }}
                                className={`flex-1 py-3 rounded-xl flex flex-col items-center gap-0.5 transition-all ${activeTab === t.id ? 'tab-active' : 'text-slate-400 hover:bg-slate-50'}`}
                            >
                                <Icon name={t.icon} className="w-5 h-5 mb-0.5" />
                                <span className="text-[10px] font-black uppercase tracking-widest">{t.label}</span>
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 p-3 w-full max-w-full mx-auto overflow-hidden">
                        {/* Tab: SEARCH */}
                        {activeTab === 'search' && (
                            <div className="space-y-4 animate-in fade-in max-w-2xl mx-auto">
                                <button onClick={() => startScanner(handleSearchChange)} className="w-full bg-emerald-600 text-white py-8 rounded-3xl font-black text-2xl flex flex-col items-center justify-center gap-2 shadow-xl active:scale-95 transition-all ring-4 ring-emerald-50">
                                    <Icon name="scan-barcode" className="w-10 h-10 mb-1" />
                                    <span>開啟掃描槍</span>
                                </button>
                                
                                <div className="relative group">
                                    <input type="text" placeholder="手動搜尋：品名、代碼、條碼、儲位..."
                                        className="w-full pl-12 pr-12 py-5 bg-white border-2 border-slate-200 rounded-2xl text-xl outline-none focus:border-emerald-500 shadow-sm transition-all focus:ring-4 focus:ring-emerald-50 font-bold"
                                        value={searchTerm} onChange={(e) => handleSearchChange(e.target.value)}
                                        autoFocus
                                    />
                                    <Icon name="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-emerald-500 w-5 h-5" />
                                    {searchTerm && (
                                        <button onClick={() => {setSearchTerm(''); setScanMatch(null);}} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 hover:text-rose-500 p-1">
                                            <Icon name="circle-x" className="w-7 h-7" />
                                        </button>
                                    )}
                                </div>

                                {searchTerm && <div className="text-[10px] text-slate-400 text-right pr-2 animate-pulse font-bold">5秒無動作自動清除結果...</div>}

                                {scanMatch && (
                                    <div className="bg-white p-8 rounded-[2.5rem] border-4 border-emerald-500 shadow-2xl text-center space-y-4 animate-in zoom-in ring-8 ring-emerald-50">
                                        <div className="text-slate-400 font-bold text-xs tracking-widest uppercase">{scanMatch.廠商} | {scanMatch.代碼}</div>
                                        <div className="text-4xl font-black text-slate-800 leading-tight">{scanMatch.品名}</div>
                                        <div className="text-[9rem] font-black text-emerald-600 my-2 tracking-tighter leading-none">{scanMatch.儲位}</div>
                                        <div className="flex flex-col items-center gap-4 pt-4 border-t border-slate-50">
                                            <span className={`px-6 py-1.5 rounded-full font-black text-xs border-2 shadow-sm uppercase ${getStatusColor(scanMatch.狀態)}`}>{scanMatch.狀態 || '正常'}</span>
                                            <button onClick={() => speak(scanMatch.儲位)} className="bg-emerald-600 text-white p-6 rounded-full inline-flex active:scale-90 shadow-xl">
                                                <Icon name="volume-2" className="w-14 h-14" />
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {searchTerm && !scanMatch && (
                                    <div className="space-y-2">
                                        <div className="text-xs font-black text-slate-400 ml-1 uppercase tracking-[0.2em]">搜尋命中清單</div>
                                        {getFilteredResults().map(m => (
                                            <div key={m.id} onClick={() => { setScanMatch(m); speak(m.儲位); }} className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center active:bg-emerald-50 cursor-pointer transition">
                                                <div className="medicine-name-cell pr-2">
                                                    <div className="font-black text-slate-800 text-lg">{m.品名}</div>
                                                    <div className="text-[11px] text-slate-400 font-bold uppercase tracking-wider">{m.廠商} | {m.代碼}</div>
                                                </div>
                                                <div className="text-right flex-shrink-0">
                                                    <div className="text-emerald-600 font-black text-3xl leading-none">{m.儲位}</div>
                                                    <span className={`text-[10px] px-2 rounded-full font-black mt-2 inline-block border-2 ${getStatusColor(m.狀態)}`}>{m.狀態 || '正常'}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Tab: INVENTORY */}
                        {activeTab === 'inventory' && (
                            <div className="space-y-4 animate-in fade-in h-full flex flex-col">
                                <div className="bg-white p-4 rounded-2xl border shadow-sm flex flex-wrap gap-2 items-center">
                                    <button onClick={() => setIsAdding(true)} className="bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-black text-sm shadow-md transition active:scale-95 flex items-center"><Icon name="plus-circle" className="w-4 h-4 mr-1.5" /> 新增</button>
                                    <button onClick={handleExport} className="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black text-sm shadow-md transition active:scale-95 flex items-center"><Icon name="download" className="w-4 h-4 mr-1.5" /> 匯出</button>
                                    <label className="bg-slate-700 text-white px-5 py-2.5 rounded-xl font-black text-sm shadow-md cursor-pointer active:bg-slate-800 transition flex items-center">
                                        <Icon name="upload" className="w-4 h-4 mr-1.5" /> 匯入
                                        <input type="file" className="hidden" accept=".xlsx,.csv" onChange={handleImport} disabled={isLoading} />
                                    </label>
                                    <div className="flex-1 min-w-[200px] relative">
                                        <input type="text" placeholder="關鍵字快速過濾總表..." className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border rounded-xl outline-none focus:border-emerald-500 text-sm font-black" value={listSearchTerm} onChange={(e) => setListSearchTerm(e.target.value)} />
                                        <Icon name="filter" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4" />
                                    </div>
                                </div>

                                {!isFirebaseActive && (
                                    <div className="p-4 bg-amber-50 text-amber-800 border-l-4 border-amber-500 text-sm font-bold rounded-xl shadow-inner">
                                        ⚠️ 診斷警告：Firebase 資料庫組件未正常連線，請確認本機與 Firebase 雲端主機網路通暢。
                                    </div>
                                )}

                                {isLoading && <div className="p-4 bg-emerald-50 text-emerald-600 text-center rounded-2xl animate-pulse font-black shadow-inner">正在同步雲端資料...</div>}

                                <div className="table-container shadow-xl">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th className="sortable" onClick={() => toggleSort('代碼')}>代碼 <SortIcon colKey="代碼" currentKey={sortConfig.key} direction={sortConfig.direction} /></th>
                                                <th className="sortable" onClick={() => toggleSort('品名')}>藥品名稱 <SortIcon colKey="品名" currentKey={sortConfig.key} direction={sortConfig.direction} /></th>
                                                <th className="sortable text-center" onClick={() => toggleSort('儲位')}>儲位 <SortIcon colKey="儲位" currentKey={sortConfig.key} direction={sortConfig.direction} /></th>
                                                <th className="sortable text-center" onClick={() => toggleSort('廠商')}>廠商 <SortIcon colKey="廠商" currentKey={sortConfig.key} direction={sortConfig.direction} /></th>
                                                <th className="sortable text-center" onClick={() => toggleSort('狀態')}>狀態 <SortIcon colKey="狀態" currentKey={sortConfig.key} direction={sortConfig.direction} /></th>
                                                <th className="text-center">條碼連結</th>
                                                <th className="text-right pr-4">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {processedInventory.map(m => (
                                                <tr key={m.id}>
                                                    <td className="mono-font text-[11px] text-slate-400 font-bold">{m.代碼}</td>
                                                    <td className="medicine-name-cell">{m.品名}</td>
                                                    <td className="text-center">
                                                        <span className="storage-cell bg-emerald-50 px-3 py-1 rounded-lg border border-emerald-100 shadow-sm">{m.儲位}</span>
                                                    </td>
                                                    <td className="text-center text-slate-500 font-bold text-xs uppercase tracking-tight">{m.廠商}</td>
                                                    <td className="text-center">
                                                        <span className={`text-[10px] px-3 py-1 rounded-full font-black border shadow-sm ${getStatusColor(m.狀態)} whitespace-nowrap`}>
                                                            {m.狀態 || '正常'}
                                                        </span>
                                                    </td>
                                                    <td className="text-center">
                                                        {m.條碼 ? (
                                                            <span className="mono-font text-[10px] text-emerald-600 font-bold opacity-60">已建立</span>
                                                        ) : (
                                                            <button 
                                                                onClick={() => {setBindingTarget(m); startScanner(val => handleSave({...m, 條碼: val}));}}
                                                                className="text-[10px] font-black bg-gradient-to-r from-orange-500 to-amber-600 text-white px-3 py-1.5 rounded-lg active:scale-95 shadow-md shadow-orange-100"
                                                            >待掃描</button>
                                                        )}
                                                    </td>
                                                    <td className="text-right pr-2">
                                                        <div className="flex justify-end gap-1">
                                                            <button onClick={() => setIsEditing(m)} className="p-3 text-slate-300 hover:text-blue-600 active:scale-90 transition-transform" title="修改"><Icon name="edit-2" className="w-5 h-5" /></button>
                                                            <button onClick={() => handleDelete(m.id)} className="p-3 text-slate-300 hover:text-rose-600 active:scale-90 transition-transform" title="刪除"><Icon name="trash-2" className="w-5 h-5" /></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {processedInventory.length === 0 && !isLoading && (
                                        <div className="p-20 text-center text-slate-300 font-black text-xl italic tracking-widest uppercase">目前查無資料</div>
                                    )}
                                </div>
                                <div className="text-center text-[10px] text-slate-400 py-2 font-bold uppercase tracking-widest">
                                    Total Items: {processedInventory.length}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 相機 Modal */}
                    {isScannerOpen && (
                        <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center p-6 bg-black/95 animate-in fade-in duration-500">
                            <div className="text-white mb-8 text-center">
                                <div className="text-2xl font-black text-emerald-400 mb-2 tracking-tight uppercase tracking-widest">{bindingTarget ? `正在綁定：${bindingTarget.品名}` : '藥品定位系統'}</div>
                                <div className="text-sm opacity-60 flex items-center justify-center gap-3 italic font-bold">
                                    <div className="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></div> 請對準藥瓶一維條碼
                                </div>
                            </div>
                            <div id="reader" className="w-full max-w-sm rounded-[3rem] overflow-hidden border-[8px] border-emerald-500 shadow-[0_0_80px_rgba(16,185,129,0.5)] bg-white scanner-container"></div>
                            <button onClick={stopScanner} className="mt-14 bg-white text-slate-900 px-16 py-5 rounded-full font-black text-2xl shadow-2xl active:scale-95 transition-all">結束掃描</button>
                        </div>
                    )}

                    {/* 編輯 / 新增 Modal */}
                    {(isEditing || isAdding) && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] flex items-center justify-center p-4 animate-in fade-in">
                            <div className="bg-white w-full max-w-lg rounded-[3rem] p-10 shadow-2xl animate-in slide-in-from-bottom-20 duration-500 overflow-y-auto max-h-[90vh]">
                                <div className="flex justify-between items-center mb-10">
                                    <div className="flex items-center gap-4">
                                        <div className="bg-emerald-100 text-emerald-600 p-4 rounded-[1.5rem] shadow-inner animate-pulse">
                                            <Icon name={isAdding ? "plus-circle" : "edit-3"} className="w-8 h-8" />
                                        </div>
                                        <div>
                                            <h3 className="font-black text-3xl text-slate-800">{isAdding ? '新增品項' : '修改藥品'}</h3>
                                            <p className="text-[10px] font-bold text-slate-400 tracking-[0.2em] uppercase">Cloud Record Sync</p>
                                        </div>
                                    </div>
                                    <button onClick={() => { setIsEditing(null); setIsAdding(false); }} className="text-slate-300 hover:text-slate-600 transition-all"><Icon name="circle-x" className="w-10 h-10" /></button>
                                </div>
                                <div className="space-y-6">
                                    <div className="space-y-2">
                                        <label className="text-[11px] font-black text-slate-500 ml-2 uppercase tracking-widest">Medicine Name 藥品品名</label>
                                        <input id="f-name" className="w-full p-5 bg-slate-50 border-4 border-transparent focus:border-emerald-500 rounded-3xl outline-none transition-all font-black text-xl shadow-inner" defaultValue={isEditing?.品名 || ''} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-6">
                                        <div className="space-y-2">
                                            <label className="text-[11px] font-black text-slate-500 ml-2 uppercase tracking-widest">Storage 儲位</label>
                                            <input id="f-loc" className="w-full p-5 bg-slate-50 border-4 border-transparent focus:border-emerald-500 rounded-3xl outline-none transition-all font-black text-xl shadow-inner" defaultValue={isEditing?.儲位 || ''} />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[11px] font-black text-slate-500 ml-2 uppercase tracking-widest">Code 代碼</label>
                                            <input id="f-code" className="w-full p-5 bg-slate-50 border-4 border-transparent focus:border-emerald-500 rounded-3xl outline-none transition-all font-black text-xl shadow-inner uppercase" defaultValue={isEditing?.代碼 || ''} />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-6">
                                        <div className="space-y-2">
                                            <label className="text-[11px] font-black text-slate-500 ml-2 uppercase tracking-widest">Vendor 廠商</label>
                                            <input id="f-vendor" className="w-full p-5 bg-slate-50 border-4 border-transparent focus:border-emerald-500 rounded-3xl outline-none transition-all font-bold shadow-inner" defaultValue={isEditing?.廠商 || ''} />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[11px] font-black text-slate-500 ml-2 uppercase tracking-widest">Status 狀態</label>
                                            <select id="f-status" className="w-full p-5 font-black bg-slate-50 border-4 border-transparent focus:border-emerald-500 rounded-3xl outline-none shadow-inner appearance-none" defaultValue={isEditing?.狀態 || '正常'}>
                                                <option value="正常">正常</option>
                                                <option value="缺貨中">缺貨中</option>
                                                <option value="暫代">暫代</option>
                                                <option value="DC">DC</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[11px] font-black text-slate-500 ml-2 uppercase tracking-widest">Barcode 國際條碼 (選填)</label>
                                        <div className="flex gap-4">
                                            <input id="f-barcode" className="flex-1 p-5 bg-slate-50 border-4 border-transparent focus:border-emerald-500 rounded-3xl outline-none transition-all font-mono text-base shadow-inner" defaultValue={isEditing?.條碼 || ''} />
                                            <button 
                                                onClick={() => startScanner(val => { document.getElementById('f-barcode').value = val; })}
                                                className="bg-slate-900 text-white px-8 rounded-3xl active:scale-90 transition-all shadow-xl flex items-center justify-center"
                                            ><Icon name="maximize" className="w-6 h-6" /></button>
                                        </div>
                                    </div>
                                </div>
                                <button 
                                    onClick={() => handleSave({
                                        id: isEditing?.id,
                                        品名: document.getElementById('f-name').value,
                                        儲位: document.getElementById('f-loc').value,
                                        代碼: document.getElementById('f-code').value,
                                        廠商: document.getElementById('f-vendor').value,
                                        條碼: document.getElementById('f-barcode').value,
                                        狀態: document.getElementById('f-status').value,
                                    })}
                                    className="w-full py-6 bg-emerald-600 text-white rounded-[2.5rem] font-black text-2xl mt-12 shadow-2xl hover:bg-emerald-700 active:scale-95 transition-all uppercase tracking-widest"
                                >確認並更新同步</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 這裡修改：移除原先導致卡死 load 的監聽器，直接渲染掛載！
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
