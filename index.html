<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>豐醫中藥儲位管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (使用 Compat 版本確保相容性) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- React & Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tab-active { @apply bg-emerald-600 text-white shadow-inner; }
        .scanner-container video { border-radius: 1rem; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { border-collapse: collapse; width: 100%; min-width: 700px; }
        th { @apply bg-slate-100 text-slate-500 font-bold p-3 text-left text-xs sticky top-0; }
        td { @apply p-3 text-sm border-b border-slate-100; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root">
        <div class="flex items-center justify-center min-h-screen text-slate-400 font-bold">
            系統載入中，請稍候...
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Firebase 設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyBFYVcsjvev6QDyPYybVLudf-lkEHzf-Xc",
            authDomain: "fyh-tcm.firebaseapp.com",
            projectId: "fyh-tcm",
            storageBucket: "fyh-tcm.firebasestorage.app",
            messagingSenderId: "710368833882",
            appId: "1:710368833882:web:56b171791c209281ca4363"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'fyh-tcm-manager';
        const getMedicineRef = () => db.collection('artifacts').doc(currentAppId).collection('public').doc('data').collection('medicines');

        const App = () => {
            const [user, setUser] = useState(null);
            const [medicines, setMedicines] = useState([]);
            const [activeTab, setActiveTab] = useState('search');
            const [searchTerm, setSearchTerm] = useState('');
            const [listSearchTerm, setListSearchTerm] = useState('');
            const [scanResult, setScanResult] = useState(null);
            const [bindingTarget, setBindingTarget] = useState(null);
            const [sortConfig, setSortConfig] = useState({ key: '儲位', direction: 'asc' });
            const [isScannerOpen, setIsScannerOpen] = useState(false);
            const [isEditing, setIsEditing] = useState(null);
            const [isAdding, setIsAdding] = useState(false);
            const [isLoading, setIsLoading] = useState(false);

            const html5QrCode = useRef(null);

            useEffect(() => {
                const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                    if (u) setUser(u);
                    else auth.signInAnonymously().catch(err => console.error("登入失敗", err));
                });
                return () => unsubscribeAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubscribeData = getMedicineRef().onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setMedicines(data);
                }, (error) => console.error("讀取失敗:", error));
                return () => unsubscribeData();
            }, [user]);

            useEffect(() => {
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }, [activeTab, medicines, scanResult, isEditing, isAdding]);

            const speak = (text) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 1.1;
                window.speechSynthesis.speak(utterance);
            };

            const handleSave = async (item) => {
                try {
                    const id = item.id || (item.代碼 ? `med_${item.代碼}` : `med_${Date.now()}`);
                    await getMedicineRef().doc(id).set({ ...item, id }, { merge: true });
                    setIsAdding(false);
                    setIsEditing(null);
                } catch (err) { alert("儲存失敗"); }
            };

            const handleDelete = async (id) => {
                if (!confirm("確定要刪除此品項嗎？")) return;
                await getMedicineRef().doc(id).delete();
            };

            const startScanner = (callback) => {
                setIsScannerOpen(true);
                setTimeout(() => {
                    html5QrCode.current = new Html5Qrcode("reader");
                    html5QrCode.current.start(
                        { facingMode: "environment" }, 
                        { fps: 10, qrbox: { width: 250, height: 150 } }, 
                        (decodedText) => {
                            stopScanner();
                            callback(decodedText);
                        }
                    ).catch(() => {
                        alert("無法開啟相機");
                        setIsScannerOpen(false);
                    });
                }, 300);
            };

            const stopScanner = () => {
                if (html5QrCode.current && html5QrCode.current.isScanning) {
                    html5QrCode.current.stop().then(() => setIsScannerOpen(false)).catch(() => setIsScannerOpen(false));
                } else setIsScannerOpen(false);
            };

            const handleSearch = (val) => {
                const cleanVal = val.replace(/\*/g, '').trim();
                setSearchTerm(cleanVal);
                if (!cleanVal) { setScanResult(null); return; }
                const match = medicines.find(m => String(m.條碼 || '').replace(/\*/g, '') === cleanVal || String(m.代碼) === cleanVal);
                if (match) { setScanResult(match); speak(match.儲位); } else setScanResult(null);
            };

            const getSortedItems = () => {
                let filtered = medicines.filter(m => 
                    (m.品名 || '').includes(listSearchTerm) || 
                    (m.儲位 || '').includes(listSearchTerm) ||
                    (m.代碼 || '').includes(listSearchTerm)
                );
                filtered.sort((a, b) => {
                    const valA = String(a[sortConfig.key] || '');
                    const valB = String(b[sortConfig.key] || '');
                    return sortConfig.direction === 'asc' ? valA.localeCompare(valB, 'zh-TW') : valB.localeCompare(valA, 'zh-TW');
                });
                return filtered;
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-emerald-700 text-white p-4 shadow-md flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <i data-lucide="shield-plus" className="w-6 h-6"></i>
                            <h1 className="text-xl font-bold">豐醫中藥管理系統</h1>
                        </div>
                        <div className="text-xs bg-emerald-800 px-3 py-1 rounded-full">{medicines.length} 項目</div>
                    </header>

                    <nav className="flex bg-white border-b sticky top-0 z-40 p-1 gap-1 shadow-sm">
                        {[
                            { id: 'search', label: '找儲位', icon: 'search' },
                            { id: 'inventory', label: '品項表', icon: 'list' }
                        ].map(t => (
                            <button 
                                key={t.id} 
                                onClick={() => setActiveTab(t.id)}
                                className={`flex-1 py-3 rounded-lg flex flex-col items-center gap-0.5 transition-all ${activeTab === t.id ? 'tab-active' : 'text-slate-400'}`}
                            >
                                <i data-lucide={t.icon} className="w-5 h-5"></i>
                                <span className="text-[10px] font-black">{t.label}</span>
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 p-3 max-w-full mx-auto w-full">
                        {activeTab === 'search' && (
                            <div className="space-y-4 animate-in fade-in max-w-2xl mx-auto">
                                <button onClick={() => startScanner(handleSearch)} className="w-full bg-emerald-600 text-white py-6 rounded-2xl font-bold text-xl flex items-center justify-center gap-3 shadow-lg active:scale-95 transition">
                                    <i data-lucide="scan-line" className="w-8 h-8"></i> 開啟掃描鏡頭
                                </button>
                                <div className="relative">
                                    <input 
                                        type="text" placeholder="手動輸入代碼或掃描條碼..."
                                        className="w-full pl-12 pr-4 py-4 bg-white border-2 border-slate-200 rounded-xl text-lg outline-none focus:border-emerald-500 shadow-sm"
                                        value={searchTerm} onChange={(e) => handleSearch(e.target.value)}
                                    />
                                    <i data-lucide="keyboard" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                </div>
                                {scanResult && (
                                    <div className="bg-white p-8 rounded-3xl border-t-8 border-emerald-500 shadow-2xl text-center space-y-4">
                                        <div className="text-slate-400 font-bold">{scanResult.廠商} | {scanResult.代碼}</div>
                                        <div className="text-3xl font-black text-slate-800">{scanResult.品名}</div>
                                        <div className="text-8xl font-black text-emerald-600 my-4">{scanResult.儲位}</div>
                                        <button onClick={() => speak(scanResult.儲位)} className="bg-emerald-100 text-emerald-600 p-5 rounded-full inline-flex active:bg-emerald-200"><i data-lucide="volume-2" className="w-10 h-10"></i></button>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'inventory' && (
                            <div className="space-y-4 animate-in fade-in">
                                <div className="bg-white p-4 rounded-xl border shadow-sm flex flex-wrap gap-2 items-center">
                                    <button onClick={() => setIsAdding(true)} className="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold flex items-center gap-1 shadow-sm"><i data-lucide="plus" className="w-4 h-4"></i> 新增</button>
                                    <div className="flex-1 relative min-w-[200px]">
                                        <input type="text" placeholder="搜尋關鍵字..." className="w-full pl-10 pr-4 py-2 bg-slate-50 border rounded-lg outline-none focus:border-emerald-500" onChange={(e) => setListSearchTerm(e.target.value)} />
                                        <i data-lucide="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                                    </div>
                                </div>

                                <div className="bg-white rounded-xl border shadow-sm table-container">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th onClick={() => setSortConfig({key: '代碼', direction: sortConfig.direction === 'asc' ? 'desc' : 'asc'})}>代碼 <i data-lucide="arrow-up-down" className="w-3 h-3 inline"></i></th>
                                                <th onClick={() => setSortConfig({key: '品名', direction: sortConfig.direction === 'asc' ? 'desc' : 'asc'})}>品名 <i data-lucide="arrow-up-down" className="w-3 h-3 inline"></i></th>
                                                <th onClick={() => setSortConfig({key: '儲位', direction: sortConfig.direction === 'asc' ? 'desc' : 'asc'})}>儲位 <i data-lucide="arrow-up-down" className="w-3 h-3 inline"></i></th>
                                                <th>廠商</th>
                                                <th>條碼建檔 (點擊空白掃描)</th>
                                                <th>狀態</th>
                                                <th className="text-right">功能</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {getSortedItems().map(m => (
                                                <tr key={m.id} className="hover:bg-slate-50 transition">
                                                    <td className="font-mono text-xs text-slate-500">{m.代碼}</td>
                                                    <td className="font-bold text-slate-800">{m.品名}</td>
                                                    <td className="font-black text-emerald-600">{m.儲位}</td>
                                                    <td className="text-slate-500 text-xs">{m.廠商}</td>
                                                    <td>
                                                        {m.條碼 ? (
                                                            <div className="flex items-center gap-2 group">
                                                                <span className="font-mono text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded">{m.條碼}</span>
                                                                <button onClick={() => {setBindingTarget(m); startScanner(val => handleSave({...m, 條碼: val}));}} className="opacity-0 group-hover:opacity-100 p-1 text-slate-400 hover:text-emerald-500"><i data-lucide="camera" className="w-3 h-3"></i></button>
                                                            </div>
                                                        ) : (
                                                            <button 
                                                                onClick={() => {setBindingTarget(m); startScanner(val => {handleSave({...m, 條碼: val}); speak("綁定成功");});}}
                                                                className="flex items-center gap-1 text-[10px] font-black bg-orange-100 text-orange-600 px-3 py-1.5 rounded-full hover:bg-orange-200 transition active:scale-95"
                                                            >
                                                                <i data-lucide="scan" className="w-3 h-3"></i> 點此掃描綁定
                                                            </button>
                                                        )}
                                                    </td>
                                                    <td>
                                                        <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${m.狀態 === '正常' ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-400'}`}>
                                                            {m.狀態 || '正常'}
                                                        </span>
                                                    </td>
                                                    <td className="text-right">
                                                        <div className="flex justify-end gap-1">
                                                            <button onClick={() => setIsEditing(m)} className="p-2 text-slate-300 hover:text-blue-500"><i data-lucide="edit-2" className="w-4 h-4"></i></button>
                                                            <button onClick={() => handleDelete(m.id)} className="p-2 text-slate-300 hover:text-red-500"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 相機 Modal */}
                    {isScannerOpen && (
                        <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center p-6 bg-black/95">
                            <div className="text-white mb-6 text-center">
                                <div className="text-xl font-black text-emerald-400 mb-1">{bindingTarget ? `正在綁定：${bindingTarget.品名}` : '找儲位中...'}</div>
                                <div className="text-sm opacity-70">請對準條碼</div>
                            </div>
                            <div id="reader" className="w-full max-w-sm rounded-3xl overflow-hidden bg-white border-4 border-emerald-500 shadow-2xl scanner-container"></div>
                            <button onClick={stopScanner} className="mt-12 bg-white text-slate-900 px-10 py-4 rounded-full font-black text-lg shadow-lg active:scale-95 transition">關閉鏡頭</button>
                        </div>
                    )}

                    {/* 編輯 Modal */}
                    {(isEditing || isAdding) && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl animate-in slide-in-from-bottom-8">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="font-black text-xl text-slate-800">{isAdding ? '新增藥品' : '編輯藥品'}</h3>
                                    <button onClick={() => { setIsEditing(null); setIsAdding(false); }} className="text-slate-400 p-2"><i data-lucide="x" className="w-6 h-6"></i></button>
                                </div>
                                <div className="space-y-4">
                                    <div><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">藥品名稱</label><input id="f-name" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-500" defaultValue={isEditing?.品名 || ''} /></div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">儲位</label><input id="f-loc" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-500" defaultValue={isEditing?.儲位 || ''} /></div>
                                        <div><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">代碼</label><input id="f-code" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-500" defaultValue={isEditing?.代碼 || ''} /></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">廠商</label><input id="f-vendor" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-500" defaultValue={isEditing?.廠商 || ''} /></div>
                                        <div><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">狀態</label><input id="f-status" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-500" defaultValue={isEditing?.狀態 || '正常'} /></div>
                                    </div>
                                    <div><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">國際條碼</label><input id="f-barcode" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-500 font-mono" defaultValue={isEditing?.條碼 || ''} /></div>
                                </div>
                                <button 
                                    onClick={() => handleSave({
                                        id: isEditing?.id,
                                        品名: document.getElementById('f-name').value,
                                        儲位: document.getElementById('f-loc').value,
                                        代碼: document.getElementById('f-code').value,
                                        廠商: document.getElementById('f-vendor').value,
                                        條碼: document.getElementById('f-barcode').value,
                                        狀態: document.getElementById('f-status').value,
                                    })}
                                    className="w-full py-4 bg-emerald-600 text-white rounded-2xl font-black mt-8 shadow-lg active:bg-emerald-700 transition"
                                >儲存變更</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
