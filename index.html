<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>豐醫中藥儲位管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (使用 Compat 版本確保最佳跨瀏覽器相容性) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- React & Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tab-active { @apply bg-emerald-600 text-white shadow-xl scale-105; }
        .table-container { 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; 
            @apply rounded-2xl shadow-inner bg-slate-50;
        }
        table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 950px; }
        th { 
            @apply bg-slate-200/80 backdrop-blur-sm text-slate-600 font-black p-4 text-left text-xs uppercase tracking-widest sticky top-0 z-10 border-b border-slate-300;
        }
        td { @apply p-4 text-sm border-b border-slate-100 bg-white transition-all duration-200; }
        tr:hover td { @apply bg-emerald-50/50; }
        .scanner-container video { border-radius: 2rem; }
        /* Scrollbar styling */
        .table-container::-webkit-scrollbar { height: 6px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; }
        .table-container::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root">
        <div class="flex flex-col items-center justify-center min-h-screen">
            <div class="w-12 h-12 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin mb-4"></div>
            <div class="text-emerald-600 font-black tracking-widest animate-pulse">系統數據同步中...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Firebase 設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyBFYVcsjvev6QDyPYybVLudf-lkEHzf-Xc",
            authDomain: "fyh-tcm.firebaseapp.com",
            projectId: "fyh-tcm",
            storageBucket: "fyh-tcm.firebasestorage.app",
            messagingSenderId: "710368833882",
            appId: "1:710368833882:web:56b171791c209281ca4363"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // 固定 App ID 以確保跨裝置同步
        const TCM_APP_ID = 'fyh-tcm-manager-v1';
        const getMedicineRef = () => db.collection('artifacts').doc(TCM_APP_ID).collection('public').doc('data').collection('medicines');

        const App = () => {
            const [user, setUser] = useState(null);
            const [medicines, setMedicines] = useState([]);
            const [activeTab, setActiveTab] = useState('search');
            const [searchTerm, setSearchTerm] = useState('');
            const [listSearchTerm, setListSearchTerm] = useState('');
            const [scanResult, setScanResult] = useState(null);
            const [bindingTarget, setBindingTarget] = useState(null);
            const [sortConfig, setSortConfig] = useState({ key: '儲位', direction: 'asc' });
            const [isScannerOpen, setIsScannerOpen] = useState(false);
            const [isEditing, setIsEditing] = useState(null);
            const [isAdding, setIsAdding] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [onlineStatus, setOnlineStatus] = useState('connecting');

            const html5QrCode = useRef(null);

            useEffect(() => {
                const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                    if (u) {
                        setUser(u);
                        setOnlineStatus('online');
                    } else {
                        auth.signInAnonymously().catch(() => setOnlineStatus('offline'));
                    }
                });
                return () => unsubscribeAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubscribeData = getMedicineRef().onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setMedicines(data);
                }, () => setOnlineStatus('error'));
                return () => unsubscribeData();
            }, [user]);

            useEffect(() => {
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }, [activeTab, medicines, scanResult, isEditing, isAdding, isScannerOpen]);

            const speak = (text) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 1.1;
                window.speechSynthesis.speak(utterance);
            };

            const handleSave = async (item) => {
                try {
                    const id = item.id || (item.代碼 ? `med_${item.代碼}` : `med_${Date.now()}`);
                    await getMedicineRef().doc(id).set({ ...item, id }, { merge: true });
                    setIsAdding(false);
                    setIsEditing(null);
                } catch (err) { 
                    alert("儲存失敗：請確認 Firestore 規則已發佈。"); 
                }
            };

            const handleDelete = async (id) => {
                if (!confirm("確定要刪除此品項嗎？")) return;
                await getMedicineRef().doc(id).delete();
            };

            const handleExport = () => {
                if (medicines.length === 0) return;
                const exportData = medicines.map(m => ({
                    '代碼': m.代碼 || '',
                    '品名': m.品名 || '',
                    '儲位': m.儲位 || '',
                    '廠商': m.廠商 || '',
                    '條碼': m.條碼 || '',
                    '狀態': m.狀態 || '正常'
                }));
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "中藥清單");
                XLSX.writeFile(wb, `豐醫中藥表_${new Date().toLocaleDateString()}.xlsx`);
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsLoading(true);
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                        const batch = db.batch();
                        let count = 0;
                        for (const row of data) {
                            if (row['品名']) {
                                const id = row['代碼'] ? `med_${row['代碼']}` : `med_${Date.now()}_${count}`;
                                const docRef = getMedicineRef().doc(id);
                                batch.set(docRef, {
                                    id,
                                    代碼: String(row['代碼'] || ''),
                                    品名: String(row['品名'] || ''),
                                    儲位: String(row['儲位'] || ''),
                                    廠商: String(row['廠商'] || ''),
                                    條碼: String(row['條碼'] || '').replace(/\*/g, '').trim(),
                                    狀態: String(row['狀態'] || '正常')
                                }, { merge: true });
                                count++;
                                if (count >= 480) break; 
                            }
                        }
                        await batch.commit();
                        alert(`成功同步 ${count} 筆資料！`);
                    } catch (err) { alert("匯入失敗：" + err.message); }
                    finally { setIsLoading(false); e.target.value = null; }
                };
                reader.readAsBinaryString(file);
            };

            const startScanner = (callback) => {
                setIsScannerOpen(true);
                setTimeout(() => {
                    html5QrCode.current = new Html5Qrcode("reader");
                    html5QrCode.current.start(
                        { facingMode: "environment" }, 
                        { fps: 20, qrbox: { width: 280, height: 160 } }, 
                        (decodedText) => {
                            stopScanner();
                            callback(decodedText);
                        }
                    ).catch(() => {
                        alert("無法存取相機，請確認權限或使用 HTTPS。");
                        setIsScannerOpen(false);
                    });
                }, 300);
            };

            const stopScanner = () => {
                if (html5QrCode.current && html5QrCode.current.isScanning) {
                    html5QrCode.current.stop().then(() => setIsScannerOpen(false)).catch(() => setIsScannerOpen(false));
                } else setIsScannerOpen(false);
            };

            const handleSearch = (val) => {
                const cleanVal = val.replace(/\*/g, '').trim();
                setSearchTerm(cleanVal);
                if (!cleanVal) { setScanResult(null); return; }
                const match = medicines.find(m => String(m.條碼 || '').replace(/\*/g, '') === cleanVal || String(m.代碼) === cleanVal);
                if (match) { 
                    setScanResult(match); 
                    speak(match.儲位); 
                } else setScanResult(null);
            };

            const getSortedItems = () => {
                let filtered = medicines.filter(m => 
                    (m.品名 || '').toLowerCase().includes(listSearchTerm.toLowerCase()) || 
                    (m.儲位 || '').toLowerCase().includes(listSearchTerm.toLowerCase()) ||
                    (m.代碼 || '').toLowerCase().includes(listSearchTerm.toLowerCase()) ||
                    (m.廠商 || '').toLowerCase().includes(listSearchTerm.toLowerCase())
                );
                filtered.sort((a, b) => {
                    const valA = String(a[sortConfig.key] || '');
                    const valB = String(b[sortConfig.key] || '');
                    return sortConfig.direction === 'asc' ? valA.localeCompare(valB, 'zh-TW') : valB.localeCompare(valA, 'zh-TW');
                });
                return filtered;
            };

            const getStatusBadge = (status) => {
                const colors = {
                    '正常': 'bg-emerald-100 text-emerald-700 border-emerald-200',
                    '缺貨中': 'bg-rose-100 text-rose-700 border-rose-200',
                    '暫代': 'bg-sky-100 text-sky-700 border-sky-200',
                    'DC': 'bg-slate-200 text-slate-600 border-slate-300'
                };
                return (
                    <span className={`px-4 py-1 rounded-full text-[11px] font-black border-2 shadow-sm uppercase tracking-tighter ${colors[status] || 'bg-slate-100 text-slate-500'}`}>
                        {status || '正常'}
                    </span>
                );
            };

            return (
                <div className="min-h-screen flex flex-col max-w-full overflow-x-hidden">
                    {/* Header */}
                    <header className="bg-gradient-to-br from-emerald-800 via-emerald-900 to-slate-900 text-white px-6 py-6 shadow-2xl flex justify-between items-center relative overflow-hidden">
                        <div className="flex items-center gap-4 z-10">
                            <div className="relative">
                                <div className={`w-4 h-4 rounded-full border-2 border-white/20 ${onlineStatus === 'online' ? 'bg-emerald-400' : 'bg-rose-400 animate-pulse'}`}></div>
                                {onlineStatus === 'online' && <div className="absolute inset-0 bg-emerald-400 rounded-full animate-ping opacity-30"></div>}
                            </div>
                            <div>
                                <h1 className="text-2xl font-black tracking-tight flex items-center gap-2">
                                    <i data-lucide="cross"></i> 豐醫中藥儲位
                                </h1>
                                <p className="text-[10px] font-bold text-emerald-400/80 tracking-[0.2em] uppercase">Cloud Integrated System</p>
                            </div>
                        </div>
                        <div className="z-10 text-right">
                            <div className="text-3xl font-black leading-none">{medicines.length}</div>
                            <div className="text-[9px] font-black opacity-50 uppercase tracking-widest mt-1">Total Items</div>
                        </div>
                        <div className="absolute -top-10 -right-10 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl"></div>
                        <div className="absolute -bottom-10 -left-10 w-48 h-48 bg-white/5 rounded-full blur-2xl"></div>
                    </header>

                    {/* Navigation */}
                    <nav className="flex bg-white/80 backdrop-blur-md border-b sticky top-0 z-40 p-2 gap-2 shadow-lg">
                        {[
                            { id: 'search', label: '快捷查詢', icon: 'zap' },
                            { id: 'inventory', label: '品項總表', icon: 'layout-grid' }
                        ].map(t => (
                            <button key={t.id} onClick={() => setActiveTab(t.id)}
                                className={`flex-1 py-4 rounded-2xl flex items-center justify-center gap-3 transition-all duration-500 font-black tracking-wider ${activeTab === t.id ? 'tab-active' : 'text-slate-400 hover:bg-slate-100 hover:text-slate-600'}`}
                            >
                                <i data-lucide={t.icon} className="w-5 h-5"></i>
                                <span className="text-sm">{t.label}</span>
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 p-4 md:p-8 w-full max-w-7xl mx-auto">
                        {/* Tab: SEARCH */}
                        {activeTab === 'search' && (
                            <div className="space-y-8 animate-in fade-in max-w-2xl mx-auto py-4">
                                <button onClick={() => startScanner(handleSearch)} className="w-full bg-emerald-600 text-white py-10 rounded-[3rem] font-black text-3xl flex flex-col items-center justify-center gap-4 shadow-[0_20px_50px_rgba(16,185,129,0.3)] hover:shadow-emerald-400/40 active:scale-95 transition-all duration-300 ring-8 ring-emerald-50">
                                    <i data-lucide="maximize" className="w-16 h-16 opacity-50"></i>
                                    <span>開啟掃描槍</span>
                                </button>
                                
                                <div className="relative group">
                                    <input type="text" placeholder="手動搜尋：代碼、名稱、條碼"
                                        className="w-full pl-16 pr-8 py-6 bg-white border-4 border-slate-100 rounded-[2rem] text-2xl outline-none focus:border-emerald-500 shadow-xl focus:ring-8 focus:ring-emerald-50 transition-all font-bold placeholder:text-slate-300"
                                        value={searchTerm} onChange={(e) => handleSearch(e.target.value)}
                                    />
                                    <i data-lucide="search" className="absolute left-6 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-emerald-500 transition-colors w-8 h-8"></i>
                                </div>

                                {scanResult && (
                                    <div className="bg-white p-10 rounded-[3.5rem] border-b-[12px] border-emerald-600 shadow-2xl text-center space-y-8 animate-in slide-in-from-bottom-12 duration-700">
                                        <div className="flex justify-center gap-3">
                                            <span className="px-4 py-1.5 bg-emerald-50 text-emerald-700 text-xs font-black rounded-xl tracking-widest">{scanResult.廠商}</span>
                                            <span className="px-4 py-1.5 bg-slate-50 text-slate-500 text-xs font-black rounded-xl">{scanResult.代碼}</span>
                                        </div>
                                        <div className="text-4xl font-black text-slate-800 leading-tight px-4">{scanResult.品名}</div>
                                        <div className="py-8 bg-slate-50 rounded-[2.5rem] border-2 border-dashed border-slate-200 relative">
                                            <div className="text-9xl font-black text-emerald-600 tracking-tighter leading-none">{scanResult.儲位}</div>
                                            <div className="mt-2 text-[10px] font-black text-slate-300 uppercase tracking-widest">Storage Location</div>
                                        </div>
                                        <div className="flex flex-col items-center gap-6">
                                            {getStatusBadge(scanResult.狀態)}
                                            <button onClick={() => speak(scanResult.儲位)} className="bg-emerald-600 text-white p-8 rounded-full inline-flex active:scale-90 shadow-2xl hover:shadow-emerald-200 transition-all">
                                                <i data-lucide="volume-2" className="w-14 h-14"></i>
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Tab: INVENTORY */}
                        {activeTab === 'inventory' && (
                            <div className="space-y-6 animate-in fade-in">
                                <div className="bg-white p-5 rounded-3xl shadow-xl border border-slate-100 flex flex-wrap gap-4 items-center">
                                    <button onClick={() => setIsAdding(true)} className="bg-emerald-600 text-white px-6 py-4 rounded-2xl font-black flex items-center gap-2 shadow-lg active:scale-95 transition-all"><i data-lucide="plus-circle"></i> 新增品項</button>
                                    <label className="bg-slate-800 text-white px-6 py-4 rounded-2xl font-black flex items-center gap-2 shadow-lg active:scale-95 transition-all cursor-pointer">
                                        <i data-lucide="file-up"></i> 匯入 Excel
                                        <input type="file" className="hidden" accept=".xlsx,.csv" onChange={handleImport} disabled={isLoading} />
                                    </label>
                                    <button onClick={handleExport} className="bg-blue-600 text-white px-6 py-4 rounded-2xl font-black flex items-center gap-2 shadow-lg active:scale-95 transition-all"><i data-lucide="file-output"></i> 匯出 Excel</button>
                                    <div className="flex-1 relative min-w-[300px]">
                                        <input type="text" placeholder="關鍵字快速過濾總表..." className="w-full pl-14 pr-4 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-emerald-500 transition-all font-bold" onChange={(e) => setListSearchTerm(e.target.value)} />
                                        <i data-lucide="filter" className="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 w-6 h-6"></i>
                                    </div>
                                </div>

                                {isLoading && <div className="p-4 bg-emerald-50 text-emerald-600 text-center rounded-2xl animate-pulse font-black shadow-inner">正在同步資料庫數據...</div>}

                                <div className="bg-white rounded-[2rem] shadow-2xl border border-slate-200 table-container">
                                    <table className="overflow-hidden">
                                        <thead>
                                            <tr>
                                                <th onClick={() => setSortConfig({key: '代碼', direction: sortConfig.direction === 'asc' ? 'desc' : 'asc'})} className="cursor-pointer hover:text-emerald-600 transition-colors">代碼</th>
                                                <th onClick={() => setSortConfig({key: '品名', direction: sortConfig.direction === 'asc' ? 'desc' : 'asc'})} className="cursor-pointer hover:text-emerald-600 transition-colors">品名</th>
                                                <th onClick={() => setSortConfig({key: '儲位', direction: sortConfig.direction === 'asc' ? 'desc' : 'asc'})} className="cursor-pointer hover:text-emerald-600 transition-colors">儲位</th>
                                                <th>廠商</th>
                                                <th className="min-w-[200px]">條碼建檔</th>
                                                <th>狀態</th>
                                                <th className="text-right">功能</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {getSortedItems().length > 0 ? getSortedItems().map(m => (
                                                <tr key={m.id}>
                                                    <td className="font-mono text-[11px] text-slate-400 font-black">{m.代碼}</td>
                                                    <td className="font-black text-slate-800 text-base">{m.品名}</td>
                                                    <td><span className="font-black text-emerald-600 text-xl bg-emerald-50 px-4 py-1.5 rounded-xl border border-emerald-100 shadow-sm">{m.儲位}</span></td>
                                                    <td className="text-slate-500 font-bold text-xs">{m.廠商}</td>
                                                    <td>
                                                        {m.條碼 ? (
                                                            <div className="flex items-center gap-2 group">
                                                                <span className="font-mono text-xs text-blue-600 bg-blue-50 px-4 py-2 rounded-xl border border-blue-100 shadow-inner">{m.條碼}</span>
                                                                <button onClick={() => {setBindingTarget(m); startScanner(val => handleSave({...m, 條碼: val}));}} className="opacity-0 group-hover:opacity-100 p-2.5 bg-white shadow-xl border rounded-full text-slate-400 hover:text-emerald-500 transition-all hover:rotate-180"><i data-lucide="refresh-cw" className="w-4 h-4"></i></button>
                                                            </div>
                                                        ) : (
                                                            <button 
                                                                onClick={() => {setBindingTarget(m); startScanner(val => {handleSave({...m, 條碼: val}); speak("綁定成功");});}}
                                                                className="flex items-center gap-2 text-[11px] font-black bg-gradient-to-r from-orange-500 to-amber-500 text-white px-5 py-2.5 rounded-2xl hover:scale-105 transition-all active:scale-95 shadow-lg shadow-orange-100"
                                                            >
                                                                <i data-lucide="camera" className="w-4 h-4"></i> 掃描綁定
                                                            </button>
                                                        )}
                                                    </td>
                                                    <td>{getStatusBadge(m.狀態)}</td>
                                                    <td className="text-right">
                                                        <div className="flex justify-end gap-2">
                                                            <button onClick={() => setIsEditing(m)} className="p-3 text-slate-300 hover:text-blue-600 hover:bg-blue-50 rounded-2xl transition-all"><i data-lucide="edit-3" className="w-5 h-5"></i></button>
                                                            <button onClick={() => handleDelete(m.id)} className="p-3 text-slate-300 hover:text-red-600 hover:bg-red-50 rounded-2xl transition-all"><i data-lucide="trash-2" className="w-5 h-5"></i></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            )) : (
                                                <tr><td colSpan="7" className="text-center py-32 text-slate-300 italic text-xl font-bold tracking-widest">目前無任何品項資料</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Camera Modal */}
                    {isScannerOpen && (
                        <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center p-6 bg-black/95 animate-in fade-in duration-500">
                            <div className="text-white mb-10 text-center animate-bounce">
                                <div className="text-3xl font-black text-emerald-400 mb-2 tracking-tight">{bindingTarget ? `正在綁定：${bindingTarget.品名}` : '藥品定位系統'}</div>
                                <div className="text-sm opacity-60 flex items-center justify-center gap-3">
                                    <div className="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></div> 請對準條碼區域
                                </div>
                            </div>
                            <div id="reader" className="w-full max-w-sm rounded-[3.5rem] overflow-hidden bg-white border-[8px] border-emerald-500 shadow-[0_0_80px_rgba(16,185,129,0.6)] scanner-container"></div>
                            <button onClick={stopScanner} className="mt-16 bg-white text-slate-900 px-16 py-5 rounded-full font-black text-2xl shadow-2xl active:scale-95 transition-all">結束掃描</button>
                        </div>
                    )}

                    {/* Edit/Add Modal */}
                    {(isEditing || isAdding) && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-xl z-[100] flex items-center justify-center p-4 animate-in fade-in">
                            <div className="bg-white w-full max-w-lg rounded-[3rem] p-10 shadow-2xl animate-in slide-in-from-bottom-20 duration-500">
                                <div className="flex justify-between items-center mb-10">
                                    <div className="flex items-center gap-4">
                                        <div className="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-3xl flex items-center justify-center shadow-inner">
                                            <i data-lucide={isAdding ? "plus-circle" : "edit-3"} className="w-8 h-8"></i>
                                        </div>
                                        <div>
                                            <h3 className="font-black text-3xl text-slate-800">{isAdding ? '新增品項' : '編輯品項'}</h3>
                                            <p className="text-xs font-bold text-slate-400 tracking-widest uppercase">Database Record Update</p>
                                        </div>
                                    </div>
                                    <button onClick={() => { setIsEditing(null); setIsAdding(false); }} className="text-slate-300 hover:text-slate-600 p-3 transition-colors"><i data-lucide="circle-x" className="w-10 h-10"></i></button>
                                </div>
                                <div className="space-y-6">
                                    <div className="space-y-2">
                                        <label className="text-xs font-black text-slate-500 ml-2 uppercase tracking-widest">Medicine Name 品名</label>
                                        <input id="f-name" className="w-full p-5 bg-slate-50 border-4 border-transparent focus:border-emerald-500 rounded-3xl outline-none transition-all font-black text-xl shadow-inner" defaultValue={isEditing?.品名 || ''} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-6">
                                        <div className="space-y-2">
                                            <label className="text-xs font-black text-slate-500 ml-2 uppercase tracking-widest">Storage 儲位</label>
                                            <input id="f-loc" className="w-full p-5 bg-slate-50 border-4 border-transparent focus:border-emerald-500 rounded-3xl outline-none transition-all font-black text-xl shadow-inner" defaultValue={isEditing?.儲位 || ''} />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-xs font-black text-slate-500 ml-2 uppercase tracking-widest">Code 代碼</label>
                                            <input id="f-code" className="w-full p-5 bg-slate-50 border-4 border-transparent focus:border-emerald-500 rounded-3xl outline-none transition-all font-black text-xl shadow-inner" defaultValue={isEditing?.代碼 || ''} />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-6">
                                        <div className="space-y-2">
                                            <label className="text-xs font-black text-slate-500 ml-2 uppercase tracking-widest">Vendor 廠商</label>
                                            <input id="f-vendor" className="w-full p-5 bg-slate-50 border-4 border-transparent focus:border-emerald-500 rounded-3xl outline-none transition-all font-bold shadow-inner" defaultValue={isEditing?.廠商 || ''} />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-xs font-black text-slate-500 ml-2 uppercase tracking-widest">Status 狀態</label>
                                            <select id="f-status" className="w-full p-5 font-black bg-slate-50 border-4 border-transparent focus:border-emerald-500 rounded-3xl outline-none shadow-inner appearance-none" defaultValue={isEditing?.狀態 || '正常'}>
                                                <option value="正常">正常</option>
                                                <option value="缺貨中">缺貨中</option>
                                                <option value="暫代">暫代</option>
                                                <option value="DC">DC</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-xs font-black text-slate-500 ml-2 uppercase tracking-widest">Barcode 國際條碼</label>
                                        <div className="flex gap-4">
                                            <input id="f-barcode" className="flex-1 p-5 bg-slate-50 border-4 border-transparent focus:border-emerald-500 rounded-3xl outline-none transition-all font-mono text-base shadow-inner" defaultValue={isEditing?.條碼 || ''} />
                                            <button 
                                                onClick={() => startScanner(val => { document.getElementById('f-barcode').value = val; })}
                                                className="bg-slate-900 text-white px-6 rounded-3xl active:scale-90 transition-all shadow-xl"
                                            ><i data-lucide="maximize"></i></button>
                                        </div>
                                    </div>
                                </div>
                                <button onClick={() => handleSave({
                                        id: isEditing?.id,
                                        品名: document.getElementById('f-name').value,
                                        儲位: document.getElementById('f-loc').value,
                                        代碼: document.getElementById('f-code').value,
                                        廠商: document.getElementById('f-vendor').value,
                                        條碼: document.getElementById('f-barcode').value,
                                        狀態: document.getElementById('f-status').value,
                                    })}
                                    className="w-full py-6 bg-emerald-600 text-white rounded-[2.5rem] font-black text-2xl mt-12 shadow-[0_15px_40px_rgba(16,185,129,0.3)] hover:bg-emerald-700 active:scale-95 transition-all"
                                >確認並發佈至雲端</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
