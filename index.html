<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>豐醫中藥儲位管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- React & Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tab-active { @apply bg-emerald-600 text-white shadow-lg; }
        .table-container { 
            overflow-x: auto; 
            @apply rounded-xl shadow-inner bg-slate-50;
        }
        /* 表格寬度隨內容自動調整 */
        table { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: auto; }
        th { 
            @apply bg-slate-100 text-slate-500 font-bold p-3 text-left text-xs uppercase tracking-wider sticky top-0 z-10 border-b border-slate-200 whitespace-nowrap;
        }
        td { @apply p-3 text-sm border-b border-slate-100 bg-white transition-all duration-150; }
        tr:hover td { @apply bg-emerald-50/50; }
        .scanner-container video { border-radius: 1.5rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root">
        <div class="flex flex-col items-center justify-center min-h-screen text-emerald-600 font-bold">
            <div class="w-8 h-8 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin mb-2"></div>
            系統連線中...
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Firebase 設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyBFYVcsjvev6QDyPYybVLudf-lkEHzf-Xc",
            authDomain: "fyh-tcm.firebaseapp.com",
            projectId: "fyh-tcm",
            storageBucket: "fyh-tcm.firebasestorage.app",
            messagingSenderId: "710368833882",
            appId: "1:710368833882:web:56b171791c209281ca4363"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        const TCM_APP_ID = 'fyh-tcm-manager-v1';
        const getMedicineRef = () => db.collection('artifacts').doc(TCM_APP_ID).collection('public').doc('data').collection('medicines');

        const App = () => {
            const [user, setUser] = useState(null);
            const [medicines, setMedicines] = useState([]);
            const [activeTab, setActiveTab] = useState('search');
            const [searchTerm, setSearchTerm] = useState('');
            const [listSearchTerm, setListSearchTerm] = useState('');
            const [scanMatch, setScanMatch] = useState(null);
            const [bindingTarget, setBindingTarget] = useState(null);
            const [sortConfig, setSortConfig] = useState({ key: '儲位', direction: 'asc' });
            const [isScannerOpen, setIsScannerOpen] = useState(false);
            const [isEditing, setIsEditing] = useState(null);
            const [isAdding, setIsAdding] = useState(false);
            const [isLoading, setIsLoading] = useState(false);

            const html5QrCode = useRef(null);
            const autoClearTimer = useRef(null);

            useEffect(() => {
                const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                    if (u) setUser(u);
                    else auth.signInAnonymously();
                });
                return () => unsubscribeAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubscribeData = getMedicineRef().onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setMedicines(data);
                });
                return () => unsubscribeData();
            }, [user]);

            // --- 10秒自動清空功能 ---
            useEffect(() => {
                if (searchTerm) {
                    if (autoClearTimer.current) clearTimeout(autoClearTimer.current);
                    autoClearTimer.current = setTimeout(() => {
                        setSearchTerm('');
                        setScanMatch(null);
                    }, 10000);
                }
                return () => {
                    if (autoClearTimer.current) clearTimeout(autoClearTimer.current);
                };
            }, [searchTerm]);

            useEffect(() => {
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }, [activeTab, medicines, scanMatch, isEditing, isAdding]);

            const speak = (text) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 1.1;
                utterance.volume = 1.0; // 明確設定音量為最高 (0.0 to 1.0)
                window.speechSynthesis.speak(utterance);
            };

            const handleSave = async (item) => {
                try {
                    const id = item.id || (item.代碼 ? `med_${item.代碼}` : `med_${Date.now()}`);
                    await getMedicineRef().doc(id).set({ ...item, id }, { merge: true });
                    setIsAdding(false);
                    setIsEditing(null);
                } catch (err) { alert("儲存失敗"); }
            };

            const handleDelete = async (id) => {
                if (!confirm("確定要刪除此品項嗎？")) return;
                await getMedicineRef().doc(id).delete();
            };

            const handleExport = () => {
                const exportData = medicines.map(m => ({
                    '代碼': m.代碼 || '',
                    '品名': m.品名 || '',
                    '儲位': m.儲位 || '',
                    '廠商': m.廠商 || '',
                    '條碼': m.條碼 || '',
                    '狀態': m.狀態 || '正常'
                }));
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "中藥清單");
                XLSX.writeFile(wb, `豐醫中藥表_${new Date().toLocaleDateString()}.xlsx`);
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsLoading(true);
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const bstr = evt.target.result;
                    const wb = XLSX.read(bstr, { type: 'binary' });
                    const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    const batch = db.batch();
                    data.forEach((row, i) => {
                        if (row['品名']) {
                            const id = row['代碼'] ? `med_${row['代碼']}` : `med_${Date.now()}_${i}`;
                            batch.set(getMedicineRef().doc(id), {
                                id,
                                代碼: String(row['代碼'] || ''),
                                品名: String(row['品名'] || ''),
                                儲位: String(row['儲位'] || ''),
                                廠商: String(row['廠商'] || ''),
                                條碼: String(row['條碼'] || '').replace(/\*/g, '').trim(),
                                狀態: String(row['狀態'] || '正常')
                            }, { merge: true });
                        }
                    });
                    await batch.commit();
                    setIsLoading(false);
                    alert("匯入成功");
                };
                reader.readAsBinaryString(file);
            };

            const startScanner = (callback) => {
                setIsScannerOpen(true);
                setTimeout(() => {
                    html5QrCode.current = new Html5Qrcode("reader");
                    html5QrCode.current.start(
                        { facingMode: "environment" }, 
                        { fps: 20, qrbox: { width: 250, height: 150 } }, 
                        (decodedText) => {
                            stopScanner();
                            callback(decodedText);
                        }
                    ).catch(() => { setIsScannerOpen(false); });
                }, 300);
            };

            const stopScanner = () => {
                if (html5QrCode.current?.isScanning) {
                    html5QrCode.current.stop().then(() => setIsScannerOpen(false)).catch(() => setIsScannerOpen(false));
                } else setIsScannerOpen(false);
            };

            const handleSearchChange = (val) => {
                setSearchTerm(val);
                const cleanVal = val.replace(/\*/g, '').trim().toLowerCase();
                if (!cleanVal) {
                    setScanMatch(null);
                    return;
                }

                const exactMatch = medicines.find(m => 
                    String(m.條碼 || '').replace(/\*/g, '') === cleanVal || 
                    String(m.代碼 || '').toLowerCase() === cleanVal
                );

                if (exactMatch) {
                    setScanMatch(exactMatch);
                    speak(exactMatch.儲位);
                } else {
                    setScanMatch(null);
                }
            };

            const getFilteredResults = () => {
                const term = searchTerm.toLowerCase().replace(/\*/g, '');
                if (!term) return [];
                return medicines.filter(m => 
                    (m.品名 || '').toLowerCase().includes(term) ||
                    (m.代碼 || '').toLowerCase().includes(term) ||
                    (m.儲位 || '').toLowerCase().includes(term) ||
                    (m.條碼 || '').includes(term)
                ).slice(0, 15);
            };

            const getSortedInventory = () => {
                const term = listSearchTerm.toLowerCase();
                let filtered = medicines.filter(m => 
                    (m.品名 || '').toLowerCase().includes(term) || 
                    (m.代碼 || '').toLowerCase().includes(term) ||
                    (m.儲位 || '').toLowerCase().includes(term)
                );
                filtered.sort((a, b) => {
                    const valA = String(a[sortConfig.key] || '');
                    const valB = String(b[sortConfig.key] || '');
                    return sortConfig.direction === 'asc' ? valA.localeCompare(valB, 'zh-TW') : valB.localeCompare(valA, 'zh-TW');
                });
                return filtered;
            };

            const getStatusColor = (status) => {
                switch(status) {
                    case '正常': return 'text-emerald-600 bg-emerald-50';
                    case '缺貨中': return 'text-rose-600 bg-rose-50';
                    case '暫代': return 'text-blue-600 bg-blue-50';
                    case 'DC': return 'text-slate-400 bg-slate-100';
                    default: return 'text-slate-600';
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-emerald-800 text-white p-4 shadow-lg flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <i data-lucide="database" className="w-5 h-5"></i>
                            <h1 className="text-lg font-bold">豐醫中藥管理</h1>
                        </div>
                        <div className="text-xs opacity-75">{medicines.length} 項目</div>
                    </header>

                    <nav className="flex bg-white border-b sticky top-0 z-40 p-1 gap-1 shadow-sm">
                        {[
                            { id: 'search', label: '快捷查詢', icon: 'zap' },
                            { id: 'inventory', label: '品項總表', icon: 'table' }
                        ].map(t => (
                            <button key={t.id} onClick={() => setActiveTab(t.id)}
                                className={`flex-1 py-3 rounded-xl flex flex-col items-center gap-0.5 transition-all ${activeTab === t.id ? 'tab-active' : 'text-slate-400'}`}
                            >
                                <i data-lucide={t.icon} className="w-5 h-5"></i>
                                <span className="text-[10px] font-black">{t.label}</span>
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 p-3 w-full max-w-4xl mx-auto">
                        {/* Tab: 快捷查詢 */}
                        {activeTab === 'search' && (
                            <div className="space-y-4 animate-in fade-in">
                                <button onClick={() => startScanner(handleSearchChange)} className="w-full bg-emerald-600 text-white py-6 rounded-2xl font-bold text-xl flex items-center justify-center gap-3 shadow-lg active:scale-95 transition">
                                    <i data-lucide="scan-barcode" className="w-8 h-8"></i> 開啟鏡頭掃描
                                </button>
                                
                                <div className="relative">
                                    <input type="text" placeholder="輸入條碼、品名搜尋..."
                                        className="w-full pl-12 pr-12 py-4 bg-white border-2 border-slate-200 rounded-xl text-lg outline-none focus:border-emerald-500 shadow-sm"
                                        value={searchTerm} onChange={(e) => handleSearchChange(e.target.value)}
                                        autoFocus
                                    />
                                    <i data-lucide="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                    {searchTerm && (
                                        <button 
                                            onClick={() => {setSearchTerm(''); setScanMatch(null);}}
                                            className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 p-1"
                                        >
                                            <i data-lucide="circle-x" className="w-6 h-6"></i>
                                        </button>
                                    )}
                                </div>

                                {searchTerm && (
                                    <div className="text-[10px] text-slate-400 text-right pr-2">10秒後自動清空...</div>
                                )}

                                {scanMatch && (
                                    <div className="bg-white p-6 rounded-3xl border-4 border-emerald-500 shadow-2xl text-center space-y-3 animate-in zoom-in ring-8 ring-emerald-50">
                                        <div className="text-slate-400 font-bold text-xs">{scanMatch.廠商} | {scanMatch.代碼}</div>
                                        <div className="text-3xl font-black text-slate-800 leading-tight">{scanMatch.品名}</div>
                                        <div className="text-8xl font-black text-emerald-600 my-2 tracking-tighter">{scanMatch.儲位}</div>
                                        <div className="flex flex-col items-center gap-3">
                                            <span className={`px-4 py-1 rounded-full font-bold text-xs ${getStatusColor(scanMatch.狀態)}`}>{scanMatch.狀態 || '正常'}</span>
                                            <button onClick={() => speak(scanMatch.儲位)} className="bg-emerald-100 text-emerald-600 p-4 rounded-full inline-flex active:scale-90"><i data-lucide="volume-2" className="w-10 h-10"></i></button>
                                        </div>
                                    </div>
                                )}

                                {searchTerm && !scanMatch && (
                                    <div className="space-y-2">
                                        <div className="text-xs font-bold text-slate-400 ml-1 tracking-widest uppercase">模糊搜尋結果</div>
                                        {getFilteredResults().map(m => (
                                            <div key={m.id} onClick={() => { setScanMatch(m); speak(m.儲位); }} className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center active:bg-emerald-50 cursor-pointer transition">
                                                <div className="truncate pr-2">
                                                    <div className="font-bold text-slate-800 text-base">{m.品名}</div>
                                                    <div className="text-[10px] text-slate-400">{m.廠商} | {m.代碼}</div>
                                                </div>
                                                <div className="text-right flex-shrink-0">
                                                    <div className="text-emerald-600 font-black text-2xl leading-none">{m.儲位}</div>
                                                    <span className={`text-[9px] px-2 rounded-full font-bold inline-block mt-1 ${getStatusColor(m.狀態)}`}>{m.狀態 || '正常'}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Tab: 品項總表 */}
                        {activeTab === 'inventory' && (
                            <div className="space-y-4 animate-in fade-in">
                                <div className="bg-white p-4 rounded-2xl border shadow-sm flex flex-wrap gap-2 items-center">
                                    <button onClick={() => setIsAdding(true)} className="bg-emerald-600 text-white px-4 py-2.5 rounded-xl font-bold flex items-center gap-1 text-sm shadow-sm transition active:scale-95"><i data-lucide="plus" className="w-4 h-4"></i> 新增</button>
                                    <button onClick={handleExport} className="bg-blue-600 text-white px-4 py-2.5 rounded-xl font-bold flex items-center gap-1 text-sm shadow-sm transition active:scale-95"><i data-lucide="download" className="w-4 h-4"></i> 匯出</button>
                                    <label className="bg-slate-700 text-white px-4 py-2.5 rounded-xl font-bold flex items-center gap-1 text-sm shadow-sm cursor-pointer active:bg-slate-800">
                                        <i data-lucide="upload" className="w-4 h-4"></i> 匯入
                                        <input type="file" className="hidden" accept=".xlsx,.csv" onChange={handleImport} disabled={isLoading} />
                                    </label>
                                    <div className="flex-1 min-w-[200px] relative">
                                        <input type="text" placeholder="快速過濾..." className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border rounded-xl outline-none focus:border-emerald-500 text-sm" onChange={(e) => setListSearchTerm(e.target.value)} />
                                        <i data-lucide="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                                    </div>
                                </div>

                                <div className="table-container">
                                    <table className="table-auto">
                                        <thead>
                                            <tr>
                                                <th onClick={() => setSortConfig({key: '代碼', direction: sortConfig.direction === 'asc' ? 'desc' : 'asc'})} className="cursor-pointer">代碼</th>
                                                <th onClick={() => setSortConfig({key: '品名', direction: sortConfig.direction === 'asc' ? 'desc' : 'asc'})} className="cursor-pointer">藥品名稱</th>
                                                <th onClick={() => setSortConfig({key: '儲位', direction: sortConfig.direction === 'asc' ? 'desc' : 'asc'})} className="cursor-pointer">儲位</th>
                                                <th>狀態</th>
                                                <th>廠商</th>
                                                <th>國際條碼</th>
                                                <th className="text-right">功能</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {getSortedInventory().map(m => (
                                                <tr key={m.id}>
                                                    <td className="font-mono text-[11px] text-slate-400">{m.代碼}</td>
                                                    <td className="font-bold text-slate-700 text-sm whitespace-normal break-words">{m.品名}</td>
                                                    <td><span className="font-black text-emerald-600 text-base">{m.儲位}</span></td>
                                                    <td>
                                                        <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold whitespace-nowrap ${getStatusColor(m.狀態)}`}>
                                                            {m.狀態 || '正常'}
                                                        </span>
                                                    </td>
                                                    <td className="text-slate-500 text-xs">{m.廠商}</td>
                                                    <td>
                                                        {m.條碼 ? (
                                                            <span className="font-mono text-xs text-blue-500 bg-blue-50 px-2 py-1 rounded whitespace-nowrap">{m.條碼}</span>
                                                        ) : (
                                                            <button 
                                                                onClick={() => {setBindingTarget(m); startScanner(val => handleSave({...m, 條碼: val}));}}
                                                                className="text-[10px] font-bold bg-orange-500 text-white px-3 py-1 rounded-lg active:scale-95 whitespace-nowrap"
                                                            >待掃描</button>
                                                        )}
                                                    </td>
                                                    <td className="text-right flex justify-end gap-1">
                                                        <button onClick={() => setIsEditing(m)} className="p-2 text-slate-300 hover:text-blue-500"><i data-lucide="edit-2" className="w-4 h-4"></i></button>
                                                        <button onClick={() => handleDelete(m.id)} className="p-2 text-slate-300 hover:text-red-500"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 相機 */}
                    {isScannerOpen && (
                        <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center p-6 bg-black/95">
                            <div className="text-white mb-6 text-center">
                                <div className="text-xl font-bold text-emerald-400 mb-1">{bindingTarget ? `綁定：${bindingTarget.品名}` : '請對準條碼'}</div>
                                <div className="text-xs opacity-70">系統將自動辨識</div>
                            </div>
                            <div id="reader" className="w-full max-w-sm overflow-hidden border-4 border-emerald-500 shadow-2xl scanner-container"></div>
                            <button onClick={stopScanner} className="mt-12 bg-white text-slate-900 px-10 py-3 rounded-full font-black shadow-lg">關閉</button>
                        </div>
                    )}

                    {/* 編輯/新增視窗 */}
                    {(isEditing || isAdding) && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="font-black text-xl text-slate-800">{isAdding ? '新增項目' : '編輯項目'}</h3>
                                    <button onClick={() => { setIsEditing(null); setIsAdding(false); }} className="text-slate-400 p-2"><i data-lucide="x" className="w-6 h-6"></i></button>
                                </div>
                                <div className="space-y-4">
                                    <div><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">藥品名稱</label><input id="f-name" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-500" defaultValue={isEditing?.品名 || ''} /></div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">儲位</label><input id="f-loc" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-500" defaultValue={isEditing?.儲位 || ''} /></div>
                                        <div><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">代碼</label><input id="f-code" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-500" defaultValue={isEditing?.代碼 || ''} /></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">廠商</label><input id="f-vendor" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-500" defaultValue={isEditing?.廠商 || ''} /></div>
                                        <div>
                                            <label className="text-[10px] font-black text-slate-400 ml-1 uppercase">狀態</label>
                                            <select id="f-status" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-500" defaultValue={isEditing?.狀態 || '正常'}>
                                                <option value="正常">正常</option>
                                                <option value="缺貨中">缺貨中</option>
                                                <option value="暫代">暫代</option>
                                                <option value="DC">DC</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">條碼</label><input id="f-barcode" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-500 font-mono" defaultValue={isEditing?.條碼 || ''} /></div>
                                </div>
                                <button 
                                    onClick={() => handleSave({
                                        id: isEditing?.id,
                                        品名: document.getElementById('f-name').value,
                                        儲位: document.getElementById('f-loc').value,
                                        代碼: document.getElementById('f-code').value,
                                        廠商: document.getElementById('f-vendor').value,
                                        條碼: document.getElementById('f-barcode').value,
                                        狀態: document.getElementById('f-status').value,
                                    })}
                                    className="w-full py-4 bg-emerald-600 text-white rounded-2xl font-black mt-8 shadow-lg active:bg-emerald-700 transition"
                                >確認儲存</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
